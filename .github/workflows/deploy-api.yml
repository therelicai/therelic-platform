name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'fly.production.toml'
      - 'migrations/**'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config fly.production.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Migrate
        run: flyctl ssh console --app=therelic-api -C "/bin/relic-api migrate up"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://api.therelic.dev/readyz; then exit 0; fi
            sleep 5
          done
          echo "smoke test failed"
          exit 1
