name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ---------------------------------------------------------------------------
  # Unit tests (no external services). pgxpool / S3 client wiring is
  # tested via fakes in internal/retention; the live-service integration
  # job below covers the actual postgres/minio paths.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: platform
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Policy engine drift check
  #
  # internal/policy/ is a byte-for-byte mirror of the runtime's policy
  # package (see UPSTREAM.txt). The diff badge's commercial promise —
  # "the platform's simulator agrees with the runtime's enforcer" —
  # depends on those files staying in lockstep. This job clones the
  # runtime at the pinned SHA and refuses to merge if any mirrored
  # file differs by a single byte. To intentionally bump: update
  # UPSTREAM_SHA in UPSTREAM.txt, re-copy the FILES list, open one PR.
  # ---------------------------------------------------------------------------
  policy-drift:
    name: Policy engine drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff vendored policy package against upstream
        run: |
          set -euo pipefail
          UP=internal/policy/UPSTREAM.txt
          if [ ! -f "$UP" ]; then
            echo "$UP missing — vendored policy mirror is misconfigured"
            exit 1
          fi
          UPSTREAM_REPO=$(grep '^UPSTREAM_REPO=' "$UP" | cut -d= -f2-)
          UPSTREAM_SHA=$(grep '^UPSTREAM_SHA=' "$UP" | cut -d= -f2-)
          FILES=$(grep '^FILES=' "$UP" | cut -d= -f2-)
          if [ -z "$UPSTREAM_REPO" ] || [ -z "$UPSTREAM_SHA" ] || [ -z "$FILES" ]; then
            echo "$UP is missing one of UPSTREAM_REPO / UPSTREAM_SHA / FILES"
            exit 1
          fi
          echo "Pinned upstream: $UPSTREAM_REPO @ $UPSTREAM_SHA"
          TMP=$(mktemp -d)
          git clone --quiet "$UPSTREAM_REPO" "$TMP/runtime"
          git -C "$TMP/runtime" checkout --quiet "$UPSTREAM_SHA"
          status=0
          for f in $FILES; do
            up="$TMP/runtime/internal/policy/$f"
            mine="internal/policy/$f"
            if [ ! -f "$up" ]; then
              echo "FAIL: upstream missing $f at SHA $UPSTREAM_SHA"
              status=1
              continue
            fi
            if ! diff -q "$up" "$mine" > /dev/null; then
              echo "FAIL: $f drifted from upstream"
              diff -u "$up" "$mine" || true
              status=1
            else
              echo "OK:   $f matches upstream"
            fi
          done
          rm -rf "$TMP"
          exit $status

  # ---------------------------------------------------------------------------
  # Vulncheck (advisory)
  # ---------------------------------------------------------------------------
  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Live-service integration: spin up Postgres + MinIO via GitHub Actions
  # service containers, apply migrations, and run any tests tagged
  # //go:build integration. We deliberately separate this from `test`
  # so a forked repo without those services can still see a green
  # baseline build.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (Postgres + MinIO)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relic
          POSTGRES_PASSWORD: relic
          POSTGRES_DB: relic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: relicminio
          MINIO_ROOT_PASSWORD: relicminio
          MINIO_DEFAULT_BUCKETS: relic-traces
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://relic:relic@localhost:5432/relic_test?sslmode=disable
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: relic-traces
      S3_ACCESS_KEY: relicminio
      S3_SECRET_KEY: relicminio
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U relic; then
              echo "postgres up"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not come up in 30s"
          exit 1
      - name: Apply migrations
        run: |
          # Run every migration in order. We don't depend on a
          # migration tool for CI — psql -f handles the simple case
          # and forces us to keep migrations idempotent + ordered.
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # auth.users stub so 006_auth_sync_audit.sql doesn't fail
          # in CI (Supabase isn't present here).
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql "$DATABASE_URL" -c "CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY, email TEXT);"
          for f in migrations/*.sql; do
            echo "==> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run integration tests
        run: go test -tags=integration -count=1 -timeout=180s ./...
