# Self-host docker-compose for The Relic.
#
# `docker compose up` brings up the full local stack:
#
#   postgres   — primary store. Migrations are applied on boot by the
#                `migrate` one-shot service before the API starts.
#   minio      — S3-compatible trace storage. The bucket is created by
#                the `minio-init` one-shot.
#   relic-api  — HTTP control plane (this repo's cmd/relic-api).
#
# All defaults are oriented at "works on my laptop without editing
# anything". Production deployments should override:
#
#   POSTGRES_PASSWORD        — pick a real one
#   MINIO_ROOT_PASSWORD      — same
#   RELIC_AUTH_MODE          — local | supabase | oidc (default: supabase
#                              today, will flip to local once WS-2 lands).
#                              Picks which auth provider the API verifies
#                              tokens against, and which optional
#                              migration folder gets applied.
#   RELIC_RLS_ENABLED        — when true, apply migrations.rls/ to enable
#                              row-level security as defense-in-depth.
#                              The API still filters at the app layer
#                              regardless; RLS is opt-in extra safety.
#   SUPABASE_JWT_SECRET      — sourced from your Supabase project. Only
#                              used when RELIC_AUTH_MODE=supabase.
#   RELIC_JWT_SECRET         — used when RELIC_AUTH_MODE=local. Generate
#                              via `openssl rand -hex 32`.
#   RELIC_TRACE_KEY          — 32-byte hex master secret for HMAC chain
#                              verification (Slice 6); generate via
#                              `openssl rand -hex 32`
#   ALLOWED_ORIGINS          — wherever therelic-app is hosted
#
# Migration layout (applied by the `migrate` one-shot in this order):
#   migrations/              — core, vanilla Postgres. Always applied.
#   migrations.supabase/     — only when RELIC_AUTH_MODE=supabase.
#                              Installs the auth.users trigger that
#                              binds new Supabase signups to a Relic org.
#   migrations.rls/          — only when RELIC_RLS_ENABLED=true.
#                              Row-level security policies. Uses
#                              request.jwt.claims, which the API sets
#                              per request via SET LOCAL.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relic}
      POSTGRES_DB: ${POSTGRES_DB:-therelic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relic} -d ${POSTGRES_DB:-therelic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply migrations in dependency order:
  #   1. migrations/             core, vanilla Postgres. Always.
  #   2. migrations.supabase/    only when RELIC_AUTH_MODE=supabase.
  #   3. migrations.rls/         only when RELIC_RLS_ENABLED=true.
  #
  # Idempotent: each applied file is recorded in schema_migrations.
  # Re-running on an existing volume is a no-op. Folder-namespaced
  # filenames (e.g. "supabase/001_...") let optional migrations
  # coexist with core migrations in the same tracking table.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-relic}
      PGPASSWORD: ${POSTGRES_PASSWORD:-relic}
      PGDATABASE: ${POSTGRES_DB:-therelic}
      RELIC_AUTH_MODE: ${RELIC_AUTH_MODE:-supabase}
      RELIC_RLS_ENABLED: ${RELIC_RLS_ENABLED:-false}
    volumes:
      - ./migrations:/migrations:ro
      - ./migrations.supabase:/migrations.supabase:ro
      - ./migrations.rls:/migrations.rls:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "==> ensuring schema_migrations tracking table";
        psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());";

        # Helper: apply one folder's *.sql files in order, tracking by
        # "<prefix>/<filename>" so optional folders never collide with
        # core migrations in schema_migrations.
        apply_folder() {
          dir="$$1"; prefix="$$2";
          for f in "$$dir"/*.sql; do
            [ -e "$$f" ] || continue;
            name="$$prefix/$$(basename "$$f")";
            already=$$(psql -tA -c "SELECT 1 FROM schema_migrations WHERE filename = '$$name'");
            if [ "$$already" = "1" ]; then
              echo "==> $$name (already applied)";
              continue;
            fi
            echo "==> $$name";
            psql -v ON_ERROR_STOP=1 -f "$$f";
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (filename) VALUES ('$$name');";
          done
        }

        if [ "$$RELIC_AUTH_MODE" = "supabase" ]; then
          echo "==> RELIC_AUTH_MODE=supabase: creating auth.users stub for the user-sync trigger";
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS auth;" \
            -c "CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY, email TEXT, raw_app_meta_data JSONB);";
        fi

        echo "==> applying core migrations (migrations/)";
        # Core migrations were historically tracked by bare filename
        # (e.g. "001_orgs_users_apikeys.sql"). Keep that convention so
        # existing volumes don't re-apply already-applied core files.
        for f in /migrations/*.sql; do
          name=$$(basename "$$f");
          already=$$(psql -tA -c "SELECT 1 FROM schema_migrations WHERE filename = '$$name'");
          if [ "$$already" = "1" ]; then
            echo "==> $$name (already applied)";
            continue;
          fi
          echo "==> $$name";
          psql -v ON_ERROR_STOP=1 -f "$$f";
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (filename) VALUES ('$$name');";
        done

        if [ "$$RELIC_AUTH_MODE" = "supabase" ]; then
          echo "==> applying Supabase-only migrations (migrations.supabase/)";
          apply_folder /migrations.supabase supabase;
        else
          echo "==> RELIC_AUTH_MODE=$$RELIC_AUTH_MODE: skipping migrations.supabase/";
        fi

        if [ "$$RELIC_RLS_ENABLED" = "true" ]; then
          echo "==> RELIC_RLS_ENABLED=true: applying RLS migrations (migrations.rls/)";
          apply_folder /migrations.rls rls;
        else
          echo "==> RELIC_RLS_ENABLED=$$RELIC_RLS_ENABLED: skipping migrations.rls/";
        fi

        echo "==> migrations complete";

  # One-shot seeder that creates a dev organization + API key when
  # the database is fresh. Idempotent — guarded by an existence
  # check so a second `docker compose up` is a no-op. The dev key
  # is `rk_dev_test_key_do_not_use_in_production` — fine for
  # laptops, never appropriate for anything network-exposed.
  seed:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-relic}
      PGPASSWORD: ${POSTGRES_PASSWORD:-relic}
      PGDATABASE: ${POSTGRES_DB:-therelic}
    volumes:
      - ./supabase/seed.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        already=$$(psql -tA -c "SELECT 1 FROM organizations WHERE id = '00000000-0000-0000-0000-000000000001'");
        if [ "$$already" = "1" ]; then
          echo "==> dev seed already present, skipping";
          exit 0;
        fi
        echo "==> seeding dev org + API key";
        psql -v ON_ERROR_STOP=1 -f /seed.sql;
        echo "";
        echo "----------------------------------------------------";
        echo "  Dev API key: rk_dev_test_key_do_not_use_in_production";
        echo "  Org ID:      00000000-0000-0000-0000-000000000001";
        echo "  Hash algo:   sha256 (legacy compat)";
        echo "----------------------------------------------------";

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-relicminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-relicminio}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # MinIO's /minio/health/live is the lightweight liveness check;
      # /ready needs configured drives which doesn't add value here.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the traces bucket if it doesn't already exist. Without
  # this, the first relic-api upload would 404 with NoSuchBucket and
  # the user would have to learn the mc CLI to fix it.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-relicminio} ${MINIO_ROOT_PASSWORD:-relicminio};
        mc mb --ignore-existing local/${S3_BUCKET:-relic-traces};
        echo "==> bucket ${S3_BUCKET:-relic-traces} ready";

  relic-api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-relic}:${POSTGRES_PASSWORD:-relic}@postgres:5432/${POSTGRES_DB:-therelic}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-relic-traces}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-relicminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-relicminio}
      S3_REGION: us-east-1
      RELIC_AUTH_MODE: ${RELIC_AUTH_MODE:-supabase}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      # Used when RELIC_AUTH_MODE=local. Generate a real one with
      # `openssl rand -hex 32` before exposing the API to a network.
      RELIC_JWT_SECRET: ${RELIC_JWT_SECRET:-dev-only-local-auth-jwt-secret-do-not-use-in-production}
      # First-boot admin (local mode only). When the users table is
      # empty, the API creates this admin's org + user so the operator
      # can log in immediately. After first boot, leave these unset.
      RELIC_ADMIN_EMAIL: ${RELIC_ADMIN_EMAIL:-}
      RELIC_ADMIN_PASSWORD: ${RELIC_ADMIN_PASSWORD:-}
      RELIC_RLS_ENABLED: ${RELIC_RLS_ENABLED:-false}
      # Allows the local therelic-app dev server (vite) and the
      # built static SPA. Override for any other origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:4173}
      # Slice 6: when RELIC_TRACE_KEY is set, the platform recomputes
      # the HMAC chain on every upload. Default-blank means presence-
      # only mode (the dashboard still shows the integrity badge but
      # the server doesn't cryptographically verify).
      RELIC_TRACE_KEY: ${RELIC_TRACE_KEY:-}
      # Slice 3: API key hashing pepper. Mandatory for new deploys;
      # falls back to the legacy plain SHA-256 hash when blank so
      # existing keys still work during rollout.
      RELIC_API_KEY_PEPPER: ${RELIC_API_KEY_PEPPER:-}
      # Slice 8 pool tuning. Sensible defaults for a small deploy.
      RELIC_PG_MAX_CONNS: ${RELIC_PG_MAX_CONNS:-20}
      RELIC_PG_MIN_CONNS: ${RELIC_PG_MIN_CONNS:-2}

volumes:
  pgdata:
  miniodata:
